<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1e36">
  <title>Philly Sports</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b1e36;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      padding: 10px 18px 12px 18px;
      justify-content: space-between;
    }

    /* Top Bar: Clock & Weather */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
      padding: 0 4px 6px 4px;
    }

    .time-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .time-display {
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
    }

    .date-display {
      font-size: 1.15rem;
      font-weight: 600;
      color: #9bbcdb;
      margin-top: 4px;
    }

    .weather-section {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
    }

    .temp-display {
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
    }

    .location-display {
      font-size: 1.15rem;
      font-weight: 600;
      color: #9bbcdb;
      margin-top: 4px;
    }

    /* Cards Layout */
    .cards-container {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      gap: 10px;
      min-height: 0;
    }

    .card {
      background-color: #0077c8;
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      flex: 1 1 0;
      min-height: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .card-label {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: center;
      color: #ffffff;
      opacity: 0.95;
    }

    .matchup-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .team-code {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      width: 65px;
      text-align: center;
    }

    .team-logo {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      flex-shrink: 0;
    }

    .team-logo svg {
      width: 100%;
      height: 100%;
    }

    .score-or-vs {
      font-size: 1.6rem;
      font-weight: 900;
      padding: 0 8px;
      min-width: 70px;
      text-align: center;
    }

    .game-details {
      text-align: center;
      font-size: 1rem;
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .broadcast-info {
      text-align: center;
      font-size: 0.85rem;
      color: #e0f0ff;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header: Clock & Weather -->
    <header class="header">
      <div class="time-section">
        <div class="time-display" id="clock">12:54</div>
        <div class="date-display" id="date">Sun, Aug 23</div>
      </div>
      <div class="weather-section">
        <div class="temp-display" id="temp">74°</div>
        <div class="location-display" id="location">Plainsboro, NJ</div>
      </div>
    </header>

    <!-- Game Status Cards -->
    <main class="cards-container">
      <!-- Most Recent Game Card -->
      <section class="card" id="recent-game-card">
        <div class="card-label">Most Recent Game</div>
        <div class="matchup-row">
          <span class="team-code">STL</span>
          <div class="team-logo">
            <!-- STL Inline Vector -->
            <svg viewBox="0 0 100 100">
              <text x="50" y="72" font-size="70" font-family="'Arial Black', sans-serif" font-weight="900" text-anchor="middle" fill="#C41E3A">S</text>
            </svg>
          </div>
          <span class="score-or-vs">6 - 7</span>
          <div class="team-logo">
            <!-- PHI Inline Vector -->
            <svg viewBox="0 0 100 100">
              <text x="50" y="74" font-size="72" font-family="'Georgia', serif" font-weight="bold" text-anchor="middle" fill="#E81828">P</text>
            </svg>
          </div>
          <span class="team-code">PHI</span>
        </div>
        <div class="game-details">Final • Fri, Aug 21, 6:40 PM</div>
      </section>

      <!-- Next Upcoming Game Card -->
      <section class="card" id="upcoming-game-card">
        <div class="card-label">Next Upcoming Game</div>
        <div class="matchup-row">
          <span class="team-code">STL</span>
          <div class="team-logo">
            <!-- STL Inline Vector -->
            <svg viewBox="0 0 100 100">
              <text x="50" y="72" font-size="70" font-family="'Arial Black', sans-serif" font-weight="900" text-anchor="middle" fill="#C41E3A">S</text>
            </svg>
          </div>
          <span class="score-or-vs">@</span>
          <div class="team-logo">
            <!-- PHI Inline Vector -->
            <svg viewBox="0 0 100 100">
              <text x="50" y="74" font-size="72" font-family="'Georgia', serif" font-weight="bold" text-anchor="middle" fill="#E81828">P</text>
            </svg>
          </div>
          <span class="team-code">PHI</span>
        </div>
        <div class="game-details">Sat, Aug 22, 6:05 PM</div>
        <div class="broadcast-info">📺 Watch on: MLB.TV, Cardinals.TV, ERADM</div>
      </section>
    </main>
  </div>

  <script>
    // Live Clock Updater
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      hours = hours % 12 || 12;

      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
