<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#002d62">
  <title>Philly Sports</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #002d62;
      --text-main: #ffffff;
      --text-muted: #b0cbe8;
      --accent: #ffd100;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
    }

    .display-stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* Screen Views */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5vh 3vw 3.5vh 3vw;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    /* --- Screen 1: Clock & Weather --- */
    .clock-center-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .time-giant {
      font-size: min(46vh, 34vw);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -2px;
      text-align: center;
    }

    .date-giant {
      font-size: min(13vh, 9vw);
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 1.5vh;
      text-align: center;
    }

    .weather-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      padding-top: 1vh;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    .location-label {
      font-size: min(8vh, 5.5vw);
      font-weight: 700;
      color: var(--text-muted);
    }

    .temp-giant {
      font-size: min(11vh, 8vw);
      font-weight: 900;
      color: var(--text-main);
    }

    /* --- Screens 2 & 3: Game Displays --- */
    .game-banner {
      font-size: min(7vh, 4.5vw);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
    }

    .game-hero-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      gap: 1.5vw;
    }

    .team-block {
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }

    .team-code-giant {
      font-size: min(22vh, 12vw);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .team-logo-giant {
      width: min(22vh, 13vw);
      height: min(22vh, 13vw);
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    .team-logo-giant svg {
      width: 100%;
      height: 100%;
    }

    .score-giant {
      font-size: min(24vh, 13vw);
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      padding: 0 1vw;
    }

    .game-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .meta-primary {
      font-size: min(9vh, 6vw);
      font-weight: 800;
      text-align: center;
      color: var(--text-main);
      line-height: 1.1;
      white-space: nowrap;
    }

    .meta-secondary {
      font-size: min(7vh, 4.5vw);
      font-weight: 700;
      text-align: center;
      color: var(--text-muted);
      margin-top: 0.5vh;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 96vw;
    }

    /* Transition Progress Bar */
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
    }

    /* Portrait Optimization (Phone Mode) */
    @media (orientation: portrait) {
      .screen {
        padding: 3vh 4vw 4vh 4vw;
      }
      .time-giant {
        font-size: 26vw;
      }
      .date-giant {
        font-size: 8vw;
      }
      .game-hero-row {
        flex-direction: column;
        justify-content: center;
        gap: 2vh;
      }
      .team-code-giant {
        font-size: 16vw;
      }
      .team-logo-giant {
        width: 18vw;
        height: 18vw;
      }
      .score-giant {
        font-size: 18vw;
        line-height: 1;
      }
      .meta-primary {
        font-size: 7.5vw;
      }
      .meta-secondary {
        font-size: 5.5vw;
      }
    }
  </style>
</head>
<body>
  <div class="display-stage" onclick="nextScreen()">
    <!-- 1. Giant Clock / Weather -->
    <section class="screen active" id="screen-clock">
      <div class="clock-center-group">
        <div class="time-giant" id="clock">--:--</div>
        <div class="date-giant" id="date">---, --- --</div>
      </div>
      <div class="weather-bar">
        <span class="location-label">Plainsboro, NJ</span>
        <span class="temp-giant" id="temp">74°</span>
      </div>
    </section>

    <!-- 2. Most Recent Game -->
    <section class="screen" id="screen-recent">
      <div class="game-banner">Most Recent Game</div>
      <div class="game-hero-row">
        <div class="team-block">
          <span class="team-code-giant">STL</span>
          <div class="team-logo-giant">
            <svg viewBox="0 0 100 100">
              <text x="50" y="74" font-size="70" font-family="'Arial Black', sans-serif" font-weight="900" text-anchor="middle" fill="#C41E3A">S</text>
            </svg>
          </div>
        </div>
        <span class="score-giant">6 - 7</span>
        <div class="team-block">
          <div class="team-logo-giant">
            <svg viewBox="0 0 100 100">
              <text x="50" y="76" font-size="75" font-family="'Georgia', serif" font-weight="bold" text-anchor="middle" fill="#E81828">P</text>
            </svg>
          </div>
          <span class="team-code-giant">PHI</span>
        </div>
      </div>
      <div class="game-footer">
        <div class="meta-primary">Final</div>
        <div class="meta-secondary">Fri, Aug 21 • 6:40 PM</div>
      </div>
    </section>

    <!-- 3. Next Upcoming Game -->
    <section class="screen" id="screen-upcoming">
      <div class="game-banner">Next Upcoming Game</div>
      <div class="game-hero-row">
        <div class="team-block">
          <span class="team-code-giant">STL</span>
          <div class="team-logo-giant">
            <svg viewBox="0 0 100 100">
              <text x="50" y="74" font-size="70" font-family="'Arial Black', sans-serif" font-weight="900" text-anchor="middle" fill="#C41E3A">S</text>
            </svg>
          </div>
        </div>
        <span class="score-giant">@</span>
        <div class="team-block">
          <div class="team-logo-giant">
            <svg viewBox="0 0 100 100">
              <text x="50" y="76" font-size="75" font-family="'Georgia', serif" font-weight="bold" text-anchor="middle" fill="#E81828">P</text>
            </svg>
          </div>
          <span class="team-code-giant">PHI</span>
        </div>
      </div>
      <div class="game-footer">
        <div class="meta-primary">Sat, Aug 22 • 6:05 PM</div>
        <div class="meta-secondary">📺 MLB.TV, Cardinals.TV, ERADM</div>
      </div>
    </section>

    <!-- Progress Indicator -->
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress"></div>
    </div>
  </div>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      hours = hours % 12 || 12;

      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Screen Cycling Carousel (8-second intervals)
    const screens = [
      document.getElementById('screen-clock'),
      document.getElementById('screen-recent'),
      document.getElementById('screen-upcoming')
    ];
    let currentIndex = 0;
    const ROTATE_INTERVAL_MS = 8000;
    let startTime = Date.now();

    function showScreen(index) {
      screens.forEach((screen, idx) => {
        screen.classList.toggle('active', idx === index);
      });
      currentIndex = index;
      startTime = Date.now();
    }

    function nextScreen() {
      showScreen((currentIndex + 1) % screens.length);
    }

    function loop() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min((elapsed / ROTATE_INTERVAL_MS) * 100, 100);
      document.getElementById('progress').style.width = `${progress}%`;

      if (elapsed >= ROTATE_INTERVAL_MS) {
        nextScreen();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
